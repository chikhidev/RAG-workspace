<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copper</title>
  <!-- favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            serif: ['"Instrument Serif"', 'serif'],
          },
          colors: {
            brand: {
              accent: '#C68346',
              base: '#191919', // Dark Slate Gray
              darker: '#111111',
              border: '#2A2A2A',
              muted: '#666666',
            },
            light: {
              base: '#FFFFFF',
              darker: '#F8F9FA',
              border: '#E5E7EB',
              muted: '#9CA3AF',
              accent: '#C68346',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #191919;
      color: #f3f4f6;
    }
    
    .light body {
      background-color: #FFFFFF;
      color: #111827;
    }
    
    .light {
      color-scheme: light;
    }
    
    .dark {
      color-scheme: dark;
    }

    .font-serif {
      font-family: 'Instrument Serif', serif;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    @keyframes blurText {
      0% {
        filter: blur(12px);
        opacity: 0;
        transform: translateY(8px) scale(0.98);
      }

      100% {
        filter: blur(0);
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-blur-text {
      animation: blurText 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .shimmer {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(255, 255, 255, 0.02) 100%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .prose {
      max-width: none;
      line-height: 1.75;
    }

    .prose {
      color: #d1d1d1;
    }

    .prose h1,
    .prose h2,
    .prose h3 {
      color: #ffffff;
      letter-spacing: -0.01em;
      font-weight: 400;
      font-style: italic;
    }

    /* Table High-Fidelity Styles */
    .prose table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.95rem;
      border: 1px solid #2A2A2A;
      border-radius: 8px;
      overflow: hidden;
    }

    .prose th {
      background-color: #252525;
      color: #C68346;
      padding: 0.75rem 1rem;
      text-align: left;
      border: 1px solid #2A2A2A;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }

    .prose td {
      padding: 0.75rem 1rem;
      border: 1px solid #2A2A2A;
      color: #d1d1d1;
    }

    .prose tr:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.01);
    }

    .prose tr:hover {
      background-color: rgba(242, 89, 18, 0.03);
    }

    .message-shadow {
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    /* Custom Loader - Search & Mind Map Search (Current) */
    .loader {
      width: 20px;
      aspect-ratio: .5;
      display: grid;
    }

    .loader:before {
      content: "";
      width: 30%;
      aspect-ratio: 1;
      border-radius: 50%;
      margin: auto auto 0;
      background: #C68346;
      animation: l9-0 .5s cubic-bezier(0, 800, 1, 800) infinite;
    }

    .loader:after {
      content: "";
      width: 100%;
      aspect-ratio: 1/cos(30deg);
      margin: 0 auto auto;
      clip-path: polygon(50% -50%, 100% 50%, 50% 150%, 0 50%);
      background: #666666;
      animation: l9-1 .5s linear infinite;
    }

    @keyframes l9-0 {
      0%,
      2% {
        translate: 0 0%
      }
      98%,
      to {
        translate: 0 -.2%
      }
    }

    @keyframes l9-1 {
      0%,
      5% {
        rotate: 0deg
      }
      95%,
      to {
        rotate: -60deg
      }
    }

    /* Loader - Mind Map Navigation (Tree Visualization) */
    .loader-mindmap-nav {
      width: 15px;
      height: 15px;
      /* transform: scale(0.29); */
      transform-origin: center;
    }

    /* Tree Nodes */
    .loader-mindmap-nav .node {
      fill: #2a2f3f;
    }

    /* Root */
    .loader-mindmap-nav .n0 { animation: mindmap-pulse 2.4s ease-in-out infinite; animation-delay: 0s; }
    /* Level 1 */
    .loader-mindmap-nav .n1 { animation: mindmap-pulse 2.4s ease-in-out infinite; animation-delay: 0.28s; }
    .loader-mindmap-nav .n2 { animation: mindmap-pulse 2.4s ease-in-out infinite; animation-delay: 1.2s; }
    /* Level 2 */
    .loader-mindmap-nav .n3 { animation: mindmap-pulse 2.4s ease-in-out infinite; animation-delay: 0.56s; }
    .loader-mindmap-nav .n4 { animation: mindmap-pulse 2.4s ease-in-out infinite; animation-delay: 0.84s; }
    .loader-mindmap-nav .n5 { animation: mindmap-pulse 2.4s ease-in-out infinite; animation-delay: 1.48s; }
    .loader-mindmap-nav .n6 { animation: mindmap-pulse 2.4s ease-in-out infinite; animation-delay: 1.76s; }

    @keyframes mindmap-pulse {
      0%, 100% { fill: #2a2f3f; }
      15%      { fill: #C68346; filter: drop-shadow(0 0 3px #C68346); }
      30%      { fill: #2a2f3f; }
    }

    /* Tree Edges */
    .loader-mindmap-nav .edge {
      stroke: #2a2f3f;
      stroke-width: 1.8;
      stroke-linecap: round;
      fill: none;
    }

    .loader-mindmap-nav .e0 { animation: mindmap-edge-flash 2.4s ease-in-out infinite; animation-delay: 0.14s; }
    .loader-mindmap-nav .e1 { animation: mindmap-edge-flash 2.4s ease-in-out infinite; animation-delay: 1.06s; }
    .loader-mindmap-nav .e2 { animation: mindmap-edge-flash 2.4s ease-in-out infinite; animation-delay: 0.42s; }
    .loader-mindmap-nav .e3 { animation: mindmap-edge-flash 2.4s ease-in-out infinite; animation-delay: 0.70s; }
    .loader-mindmap-nav .e4 { animation: mindmap-edge-flash 2.4s ease-in-out infinite; animation-delay: 1.34s; }
    .loader-mindmap-nav .e5 { animation: mindmap-edge-flash 2.4s ease-in-out infinite; animation-delay: 1.62s; }

    @keyframes mindmap-edge-flash {
      0%, 100% { stroke: #2a2f3f; }
      15%      { stroke: #C68346; }
      30%      { stroke: #2a2f3f; }
    }

    /* Loader - Thinking (Rotating Hexagon) */
    .loader-thinking {
      width: 14px;
      height: 14px;
      aspect-ratio: 1;
      position: relative;
      border: 1px solid #0000;
      animation: l11-rotate 3s linear infinite;
    }

    .loader-thinking:before {
      content: "";
      position: absolute;
      width: 5px;
      height: 5px;
      inset: auto 50% 0;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #C68346;
      transform: translateX(-50%);
      animation: l11-bounce .5s cubic-bezier(0, 500, 1, 500) infinite;
    }

    .loader-thinking:after {
      content: "";
      position: absolute;
      --b: 1px;
      width: 8px;
      height: 8px;
      inset: calc(-1 * var(--b)) auto calc(-1 * var(--b)) 50%;
      aspect-ratio: 1/cos(30deg);
      translate: -50% 0;
      clip-path: 
        polygon(0 50%, 50% -50%, 100% 50%, 50% 150%, 0 50%,
        var(--b) 50%,
        calc(25% + var(--b)*cos(60deg)) calc(100% - var(--b)*sin(60deg)),
        calc(75% - var(--b)*cos(60deg)) calc(100% - var(--b)*sin(60deg)),
        calc(100% - var(--b)) 50%,
        calc(75% - var(--b)*cos(60deg)) calc(var(--b)*sin(60deg)),
        calc(25% + var(--b)*cos(60deg)) calc(var(--b)*sin(60deg)),
        var(--b) 50%);
      background: #524656;
      animation: l11-rotate 3s linear infinite reverse;
    }

    @keyframes l11-bounce {
      0%, 2% {
        bottom: 0%;
      }
      98%, to {
        bottom: 0.1%;
      }
    }

    @keyframes l11-rotate {
      to {
        rotate: 1turn;
      }
    }

    /* Neural Network Loader - Thinking/Planning Phase */
    .nn-loader {
      width: 15px;
      height: 15px;
      transform-origin: center;
    }

    /* Resting nodes */
    .nn-loader .node {
      fill: #2a2f3f;
    }

    /* Node glow when signal arrives */
    .nn-loader .n-in0 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 0s; }
    .nn-loader .n-in1 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 0.22s; }
    .nn-loader .n-in2 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 0.44s; }

    .nn-loader .n-h0 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 0.55s; }
    .nn-loader .n-h1 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 0.77s; }
    .nn-loader .n-h2 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 0.99s; }
    .nn-loader .n-h3 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 1.21s; }

    .nn-loader .n-o0 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 1.43s; }
    .nn-loader .n-o1 { animation: node-hit 2.2s ease-in-out infinite; animation-delay: 1.65s; }

    @keyframes node-hit {
      0%, 100% { fill: #2a2f3f; }
      18%      { fill: #C68346; filter: drop-shadow(0 0 3px rgba(193,95,60,0.8)); }
      36%      { fill: #2a2f3f; }
    }

    /* Edges resting */
    .nn-loader .edge {
      fill: none;
      stroke: #222838;
      stroke-width: 1;
      stroke-linecap: round;
    }

    /* Signal traveling dots — each edge gets its own timing */
    .nn-loader .sig {
      fill: none;
      stroke: #C68346;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 3 100;
      stroke-dashoffset: 100;
      opacity: 0;
    }

    /* Input → Hidden layer edges */
    .nn-loader .sig-ih0 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.08s; }
    .nn-loader .sig-ih1 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.15s; }
    .nn-loader .sig-ih2 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.25s; }
    .nn-loader .sig-ih3 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.30s; }
    .nn-loader .sig-ih4 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.38s; }
    .nn-loader .sig-ih5 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.42s; }
    .nn-loader .sig-ih6 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.18s; }
    .nn-loader .sig-ih7 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.34s; }
    .nn-loader .sig-ih8 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.46s; }

    /* Hidden → Output layer edges */
    .nn-loader .sig-ho0 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.62s; }
    .nn-loader .sig-ho1 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.70s; }
    .nn-loader .sig-ho2 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.78s; }
    .nn-loader .sig-ho3 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.85s; }
    .nn-loader .sig-ho4 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 0.95s; }
    .nn-loader .sig-ho5 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 1.02s; }
    .nn-loader .sig-ho6 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 1.12s; }
    .nn-loader .sig-ho7 { animation: sig-travel 2.2s ease-in-out infinite; animation-delay: 1.20s; }

    @keyframes sig-travel {
      0%   { stroke-dashoffset: 100; opacity: 0; }
      5%   { opacity: 1; }
      50%  { stroke-dashoffset: 0; opacity: 1; }
      55%  { opacity: 0; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    /* File Search Loader - Searching Phase */
    .file-loader {
      width: 18px;
      height: 18px;
      transform-origin: center;
    }

    /* Stacked files */
    .file-loader .file {
      fill: none;
      stroke: #2a2f3f;
      stroke-width: 1.5;
    }

    /* Text lines that flash when scanned */
    .file-loader .line-flash {
      stroke: #2a2f3f;
      stroke-width: 1.2;
      stroke-linecap: round;
    }

    .file-loader .lf0 { animation: line-scan 2.4s ease-in-out infinite; animation-delay: 0.2s; }
    .file-loader .lf1 { animation: line-scan 2.4s ease-in-out infinite; animation-delay: 0.4s; }
    .file-loader .lf2 { animation: line-scan 2.4s ease-in-out infinite; animation-delay: 0.6s; }
    .file-loader .lf3 { animation: line-scan 2.4s ease-in-out infinite; animation-delay: 0.8s; }
    .file-loader .lf4 { animation: line-scan 2.4s ease-in-out infinite; animation-delay: 1.0s; }
    .file-loader .lf5 { animation: line-scan 2.4s ease-in-out infinite; animation-delay: 1.2s; }

    @keyframes line-scan {
      0%, 100% { stroke: #2a2f3f; }
      20%      { stroke: #C68346; }
      40%      { stroke: #2a2f3f; }
    }

    /* Magnifying glass components */
    .file-loader .glass-lens {
      fill: rgba(193, 95, 60, 0.1);
    }

    .file-loader .glass-circle {
      fill: none;
      stroke: #C68346;
      stroke-width: 1.8;
    }

    .file-loader .glass-handle {
      stroke: #C68346;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .file-loader g {
      animation: glass-scan 2.4s ease-in-out infinite;
    }

    @keyframes glass-scan {
      0%, 100% { transform: translateY(-6px); }
      50%      { transform: translateY(6px); }
    }

    /* Thinking Loader - Analyzing/Planning/Thinking Phase */
    .thinking-loader {
      width: 20px;
      height: 20px;
      transform-origin: center;
    }

    /* Ring */
    .thinking-loader .ring {
      fill: none;
      stroke: #2a2f3f;
      stroke-width: 1.5;
    }

    /* Traveling arc on the ring */
    .thinking-loader .arc {
      fill: none;
      stroke: #C68346;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 18 57;
      stroke-dashoffset: 75;
      animation: arc-spin 1.2s linear infinite;
      filter: drop-shadow(0 0 3px rgba(193,95,60,0.6));
    }

    @keyframes arc-spin {
      to { stroke-dashoffset: 0; }
    }

    /* Center dot */
    .thinking-loader .center {
      fill: #2a2f3f;
      animation: center-pulse 1.2s ease-in-out infinite;
    }

    @keyframes center-pulse {
      0%, 100% { fill: #2a2f3f; r: 3; }
      50%      { fill: #C68346; r: 3.5; }
    }

    /* Loader - Final Answer Generation (Wave/Stream) */
    .loader-generating {
      width: 20px;
      height: 14px;
      box-shadow: 0 2px 0 #C68346;
      position: relative;
      clip-path: inset(-15px 0 -2px);
    }

    .loader-generating:before {
      content: "";
      position: absolute;
      inset: auto calc(50% - 6px) 0;
      height: 14px;
      --g: no-repeat linear-gradient(#C68346 0 0);
      background: var(--g), var(--g), var(--g), var(--g);
      background-size: 4px 3px;
      animation:
        l7-gen-1 2s infinite linear,
        l7-gen-2 2s infinite linear;
    }

    @keyframes l7-gen-1 {
      0%,
      100% {
        background-position: 0 -50px, 100% -50px;
      }
      17.5% {
        background-position: 0 100%, 100% -50px, 0 -50px, 100% -50px;
      }
      35% {
        background-position: 0 100%, 100% 100%, 0 -50px, 100% -50px;
      }
      52.5% {
        background-position: 0 100%, 100% 100%, 0 calc(100% - 16px), 100% -50px;
      }
      70%,
      98% {
        background-position: 0 100%, 100% 100%, 0 calc(100% - 16px), 100% calc(100% - 16px);
      }
    }

    @keyframes l7-gen-2 {
      0%,
      70% {
        transform: translate(0);
      }
      100% {
        transform: translate(200%);
      }
    }

    .ai-glow-box {
      border-color: #C68346 !important;
      animation: borderFadeIn 0.3s ease-in, glowPulse 2s ease-in-out infinite;
    }

    .ai-glow-box-fading {
      animation: borderFadeOut 1s ease-out forwards, glowFadeOut 1s ease-out forwards;
    }

    @keyframes borderFadeIn {
      0% {
        border-color: transparent;
        box-shadow: none;
      }
      100% {
        border-color: #C68346;
        box-shadow: 0 0 20px rgba(193, 95, 60, 0.2), inset 0 0 15px rgba(193, 95, 60, 0.1);
      }
    }

    @keyframes borderFadeOut {
      0% {
        border-color: #C68346;
        box-shadow: 0 0 20px rgba(193, 95, 60, 0.2), inset 0 0 15px rgba(193, 95, 60, 0.1);
      }
      50% {
        border-color: rgba(193, 95, 60, 0.5);
        box-shadow: 0 0 15px rgba(193, 95, 60, 0.15), inset 0 0 10px rgba(193, 95, 60, 0.08);
      }
      100% {
        border-color: transparent;
        box-shadow: none;
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(193, 95, 60, 0.2), inset 0 0 15px rgba(193, 95, 60, 0.1);
      }
      50% {
        box-shadow: 0 0 30px rgba(193, 95, 60, 0.35), inset 0 0 20px rgba(193, 95, 60, 0.15);
      }
    }

    @keyframes glowFadeOut {
      0% {
        background: linear-gradient(90deg, rgba(193, 95, 60, 0.08) 0%, rgba(193, 95, 60, 0.12) 100%);
      }
      50% {
        background: linear-gradient(90deg, rgba(193, 95, 60, 0.04) 0%, rgba(193, 95, 60, 0.06) 100%);
      }
      100% {
        background: transparent;
      }
    }
  </style>
</head>

<body class="selection:bg-brand-accent selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
